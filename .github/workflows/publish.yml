name: Publish to MCP Registry

on:
    push:
        branches: [main]
        paths:
            - "server.json"
            - "server-us.json"
    workflow_dispatch:

jobs:
    publish:
        name: Publish to MCP Registry
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check which manifests need publishing
              id: check
              run: |
                  NEEDS_PUBLISH=false
                  : > publish-manifests.txt

                  for manifest in server.json server-us.json; do
                      [ -f "$manifest" ] || continue

                      NAME=$(jq -r '.name' "$manifest")
                      VERSION=$(jq -r '.version' "$manifest")
                      echo "Checking $manifest ($NAME @ $VERSION)..."

                      RESPONSE=$(curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}" 2>/dev/null) || {
                          echo "::warning::Failed to fetch registry data for $NAME. Will publish."
                          echo "$manifest" >> publish-manifests.txt
                          NEEDS_PUBLISH=true
                          continue
                      }

                      if ! echo "$RESPONSE" | jq -e '.servers' > /dev/null 2>&1; then
                          echo "::warning::Invalid registry response for $NAME. Will publish."
                          echo "$manifest" >> publish-manifests.txt
                          NEEDS_PUBLISH=true
                          continue
                      fi

                      VERSION_EXISTS=$(echo "$RESPONSE" | jq -r --arg n "$NAME" --arg v "$VERSION" '
                          [.servers[] | select(.server.name == $n) | .server.version] | any(. == $v)
                      ' 2>/dev/null)

                      if [ "$VERSION_EXISTS" = "true" ]; then
                          echo "::notice::$NAME version $VERSION already published. Skipping $manifest."
                      else
                          echo "✅ Will publish $manifest ($NAME @ $VERSION)"
                          echo "$manifest" >> publish-manifests.txt
                          NEEDS_PUBLISH=true
                      fi
                  done

                  if [ "$NEEDS_PUBLISH" = "true" ]; then
                      echo "should_publish=true" >> $GITHUB_OUTPUT
                  else
                      echo "should_publish=false" >> $GITHUB_OUTPUT
                  fi

            - name: Install MCP Publisher
              if: steps.check.outputs.should_publish == 'true'
              run: |
                  curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

            - name: Login to MCP Registry
              if: steps.check.outputs.should_publish == 'true'
              run: ./mcp-publisher login dns --domain=port.io --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

            - name: Publish to Registry
              if: steps.check.outputs.should_publish == 'true'
              run: |
                  while IFS= read -r manifest; do
                      [ -f "$manifest" ] || continue
                      NAME=$(jq -r '.name' "$manifest")
                      VERSION=$(jq -r '.version' "$manifest")
                      echo "Publishing $manifest ($NAME @ $VERSION)..."
                      ./mcp-publisher publish "$manifest"
                  done < publish-manifests.txt

            - name: Report Success
              if: steps.check.outputs.should_publish == 'true' && success()
              run: |
                  echo "✅ Published manifests:"
                  cat publish-manifests.txt
                  echo ""
                  echo "Latest registry entries:"
                  for name in io.port/Port io.port/Port-US; do
                      curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" | jq --arg n "$name" '
                          [.servers[] | select(.server.name == $n and (._meta."io.modelcontextprotocol.registry/official".isLatest == true))]
                          | .[0].server | {name, title, version, remotes}
                      '
                  done

            - name: Report Skipped
              if: steps.check.outputs.should_publish == 'false'
              run: echo "ℹ️ All manifest versions are already in the registry — nothing to publish."